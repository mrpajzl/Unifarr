services:
  postgres:
    image: postgres:16-alpine
    container_name: unifarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unifarr
      POSTGRES_USER: unifarr
      POSTGRES_PASSWORD: unifarr_password_change_me
    volumes:
      - /mnt/HDDs/media/unifarr/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifarr"]
      interval: 10s
      timeout: 5s
      retries: 5

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: unifarr-qbittorrent
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Prague
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - /mnt/HDDs/media/unifarr/qbittorrent-config:/config
      - /mnt/HDDs/media:/data/media
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      # WebUI NOT exposed externally (backend controls it via internal network)
    restart: unless-stopped

  backend:
    image: ghcr.io/mrpajzl/unifarr/backend:main
    container_name: unifarr-backend
    restart: unless-stopped
    ports:
      - "32302:3000"
    environment:
      NODE_ENV: production
      # PostgreSQL connection
      DATABASE_URL: postgresql://unifarr:unifarr_password_change_me@postgres:5432/unifarr
      # Library paths
      MOVIES_PATH: /data/media/movies
      TV_PATH: /data/media/tvshows
      # Downloads path (where torrents/HTTP downloads go)
      DOWNLOADS_PATH: /data/downloads
      # qBittorrent sidecar (internal — do not expose WebUI port externally)
      QBITTORRENT_HOST: qbittorrent
      QBITTORRENT_PORT: "8080"
      QBITTORRENT_USERNAME: admin
      QBITTORRENT_PASSWORD: unifarr_qbt_2024
    volumes:
      - /mnt/HDDs/media/unifarr/data:/app/data
      - /mnt/HDDs/media:/data/media
      - /mnt/HDDs/media/downloads:/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
      qbittorrent:
        condition: service_started

  frontend:
    image: ghcr.io/mrpajzl/unifarr/frontend:main
    container_name: unifarr-frontend
    restart: unless-stopped
    ports:
      - "32301:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://10.0.0.141:32302
    depends_on:
      - backend
