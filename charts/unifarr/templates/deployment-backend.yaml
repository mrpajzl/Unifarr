apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unifarr.fullname" . }}-backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "unifarr.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "unifarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "unifarr.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.backend.port }}
          protocol: TCP
        env:
        - name: PORT
          value: "{{ .Values.backend.port }}"
        - name: NODE_ENV
          value: {{ .Values.backend.env.NODE_ENV | quote }}
        - name: MOVIES_PATH
          value: {{ .Values.mediaPaths.movies.mountPath | quote }}
        - name: TV_PATH
          value: {{ .Values.mediaPaths.tvshows.mountPath | quote }}
        - name: DOWNLOADS_PATH
          value: {{ .Values.mediaPaths.downloads.mountPath | quote }}
        volumeMounts:
        {{- if .Values.backend.persistence.data.enabled }}
        - name: data
          mountPath: {{ .Values.backend.persistence.data.mountPath }}
        {{- end }}
        {{- if .Values.backend.persistence.downloads.enabled }}
        - name: downloads
          mountPath: {{ .Values.backend.persistence.downloads.mountPath }}
        {{- end }}
        {{- if .Values.mediaPaths.movies.enabled }}
        - name: movies
          mountPath: {{ .Values.mediaPaths.movies.mountPath }}
        {{- end }}
        {{- if .Values.mediaPaths.tvshows.enabled }}
        - name: tvshows
          mountPath: {{ .Values.mediaPaths.tvshows.mountPath }}
        {{- end }}
        {{- if .Values.mediaPaths.downloads.enabled }}
        - name: downloads-media
          mountPath: {{ .Values.mediaPaths.downloads.mountPath }}
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
      volumes:
      {{- if .Values.backend.persistence.data.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "unifarr.fullname" . }}-backend-data
      {{- end }}
      {{- if .Values.backend.persistence.downloads.enabled }}
      - name: downloads
        persistentVolumeClaim:
          claimName: {{ include "unifarr.fullname" . }}-backend-downloads
      {{- end }}
      {{- if .Values.mediaPaths.movies.enabled }}
      - name: movies
        hostPath:
          path: {{ .Values.mediaPaths.movies.hostPath }}
          type: Directory
      {{- end }}
      {{- if .Values.mediaPaths.tvshows.enabled }}
      - name: tvshows
        hostPath:
          path: {{ .Values.mediaPaths.tvshows.hostPath }}
          type: Directory
      {{- end }}
      {{- if .Values.mediaPaths.downloads.enabled }}
      - name: downloads-media
        hostPath:
          path: {{ .Values.mediaPaths.downloads.hostPath }}
          type: Directory
      {{- end }}
