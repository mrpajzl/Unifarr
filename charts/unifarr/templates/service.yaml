apiVersion: v1
kind: Service
metadata:
  name: {{ include "unifarr.fullname" . }}-backend
  labels:
    app.kubernetes.io/component: backend
    {{- include "unifarr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.backend.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/component: backend
    {{- include "unifarr.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unifarr.fullname" . }}-frontend
  labels:
    app.kubernetes.io/component: frontend
    {{- include "unifarr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.frontend.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/component: frontend
    {{- include "unifarr.selectorLabels" . | nindent 4 }}
