## Unifarr Configuration

## Backend settings
backend:
  image:
    repository: ghcr.io/mrpajzl/unifarr/backend
    tag: latest
    pullPolicy: Always
  
  port: 3002
  
  env:
    NODE_ENV: production
  
  persistence:
    data:
      enabled: true
      mountPath: /app/data
      size: 10Gi
    downloads:
      enabled: true
      mountPath: /app/downloads
      size: 100Gi
  
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

## Frontend settings
frontend:
  image:
    repository: ghcr.io/mrpajzl/unifarr/frontend
    tag: latest
    pullPolicy: Always
  
  port: 3000
  
  env:
    # Set to your backend URL
    NUXT_PUBLIC_API_BASE: "http://unifarr-backend:3002"
  
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

## Media paths (mount your existing media library)
mediaPaths:
  movies:
    enabled: true
    hostPath: /mnt/storage/media/movies
    mountPath: /data/movies
  
  tvshows:
    enabled: true
    hostPath: /mnt/storage/media/tvshows
    mountPath: /data/tvshows
  
  downloads:
    enabled: true
    hostPath: /mnt/storage/media/downloads
    mountPath: /data/downloads

## Service configuration
service:
  type: ClusterIP
  backend:
    port: 3002
  frontend:
    port: 3000

## Ingress (optional)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: unifarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
