# TrueNAS SCALE specific values
# These override values.yaml when deployed via TrueNAS UI

image:
  pullPolicy: Always

# TrueNAS manages storage differently
backend:
  persistence:
    data:
      enabled: true
      type: ixVolume
      mountPath: /app/data
      
    downloads:
      enabled: true
      type: ixVolume
      mountPath: /app/downloads

# Host paths for media
mediaPaths:
  movies:
    enabled: true
    type: hostPath
    hostPath: /mnt/storage/media/movies
    mountPath: /data/movies
    
  tvshows:
    enabled: true
    type: hostPath
    hostPath: /mnt/storage/media/tvshows
    mountPath: /data/tvshows
    
  downloads:
    enabled: true
    type: hostPath
    hostPath: /mnt/storage/media/downloads
    mountPath: /data/downloads

# Service configuration
service:
  type: NodePort
  backend:
    port: 3002
  frontend:
    port: 3000

# Portal configuration for TrueNAS UI
portal:
  enabled: true
  protocol: http
  host: 0.0.0.0
  port: 3000
  path: /
