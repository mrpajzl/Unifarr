version: '3.8'

services:
  # qBittorrent only for development
  # Frontend and backend run locally with npm run dev
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent-dev
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent-dev-config:/config
      - ${DOWNLOADS_PATH:-./downloads}:/downloads:rw
    ports:
      - "8080:8080"  # Web UI
      - "6881:6881"  # Torrent port
      - "6881:6881/udp"

volumes:
  qbittorrent-dev-config:
    driver: local
