version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unifarr-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=unifarr
      - POSTGRES_PASSWORD=unifarr
      - POSTGRES_DB=unifarr
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - unifarr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifarr"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unifarr-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - /mnt/storage/media/movies:/data/movies
      - /mnt/storage/media/tvshows:/data/tvshows
      - /mnt/storage/media/downloads:/data/downloads
      - ./backend/data:/app/data
      - ./backend/downloads:/app/downloads
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DATABASE_URL=postgresql://unifarr:unifarr@postgres:5432/unifarr
      - MOVIES_PATH=/data/movies
      - TV_PATH=/data/tvshows
      - DOWNLOADS_PATH=/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unifarr

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NUXT_PUBLIC_API_BASE=http://10.0.0.141:3002
    container_name: unifarr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://10.0.0.141:3002
    depends_on:
      - backend
    networks:
      - unifarr

networks:
  unifarr:
    driver: bridge
