version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unifarr-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=unifarr
      - POSTGRES_PASSWORD=unifarr
      - POSTGRES_DB=unifarr
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - unifarr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifarr"]
      interval: 10s
      timeout: 5s
      retries: 5

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: unifarr-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Prague
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./qbittorrent-config:/config
      - /mnt/storage/media:/data/media
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      # WebUI NOT exposed externally by default (backend controls it)
    networks:
      - unifarr
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unifarr-backend
    restart: unless-stopped
    ports:
      - "32302:3000"
    volumes:
      - /mnt/storage/media/movies:/data/movies
      - /mnt/storage/media/tvshows:/data/tvshows
      - /mnt/storage/media/downloads:/data/downloads
      - ./backend/data:/app/data
      - ./backend/downloads:/app/downloads
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://unifarr:unifarr@postgres:5432/unifarr
      - MOVIES_PATH=/data/movies
      - TV_PATH=/data/tvshows
      - DOWNLOADS_PATH=/data/downloads
      - QBITTORRENT_HOST=qbittorrent
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USERNAME=admin
      - QBITTORRENT_PASSWORD=unifarr_qbt_2024
    depends_on:
      postgres:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    networks:
      - unifarr

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NUXT_PUBLIC_API_BASE=http://10.0.0.141:32302
    container_name: unifarr-frontend
    restart: unless-stopped
    ports:
      - "32301:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://10.0.0.141:32302
    depends_on:
      - backend
    networks:
      - unifarr

networks:
  unifarr:
    driver: bridge
