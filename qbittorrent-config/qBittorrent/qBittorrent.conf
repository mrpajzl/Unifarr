[BitTorrent]
Session\DefaultSavePath=/data/media/downloads
Session\TempPath=/data/media/downloads/incomplete
Session\TempPathEnabled=true

[Preferences]
WebUI\Port=8080
WebUI\Username=admin
; Disable auth for all subnets — this is an internal Docker sidecar,
; not accessible from outside the container network.
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=0.0.0.0/0

; Auto-management off — backend controls categories/paths
Bittorrent\MaxRatio=2
Bittorrent\MaxRatioAction=1
Bittorrent\MaxSeedingTime=10080
Bittorrent\MaxSeedingTimeAction=1
